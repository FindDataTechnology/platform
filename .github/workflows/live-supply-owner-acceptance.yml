# Live acceptance for the supply-open / owner batch (add-vendor-supply-open /
# add-market-revenue-share / add-fleet-owner-surface / add-fleet-owner-iteration).
#
# Dispatch-only by design: runs free runners on this PUBLIC repo
# (FindDataTechnology/platform), so it does not spend private-repo minutes.
# Registry lane's org workflow remains quota-blocked until minutes reset
# (see docs/registry-maintenance.md §15.70).
#
# Secrets required in this repo:
#   FACET_BASE_URL          production facet origin (e.g. https://facet.finddatatech.cloud)
#   FACET_INTERNAL_TOKEN    internal identity channel credential (wanxing-fleet/registry_token lane)
#   TEST_EMAIL              walkthrough account (aloadtree@gmail.com)
#
# Scope:
#   A-rules run in any dispatch: vendor 注册即得 / 署名投影 / 价格声明闸 /
#   免费链 / owner board + 机位占位 + 花销投影形状 / digest 订阅路。
#   B-rules (onboarding live 写入、付费+credit 环) stay SKIPPED until
#   REGISTRY_VENDOR_LANE=service-token lands on cheap-8 — flip
#   `accept_token_lane: 1` at the ops window, never fake-green here.
name: live-supply-owner-acceptance
name: live-supply-owner-acceptance

on:
  workflow_dispatch:
    inputs:
      detailed:
        description: "B-rules rundown control (placeholder; skip behavior follows accept_token_lane)"
        required: false
        default: "full-skip-B"
      accept_token_lane:
        description: "REGISTRY_VENDOR_LANE=service-token 的 fork 车道已部署于 cheap-8? (1=yes)"
        required: false
        default: "0"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACET_BASE_URL: ${{ secrets.FACET_BASE_URL }}
      FACET_INTERNAL_TOKEN: ${{ secrets.FACET_INTERNAL_TOKEN }}
      TEST_EMAIL: ${{ vars.TEST_EMAIL || 'aloadtree@gmail.com' }}
      ACCEPT_TOKEN_LANE: ${{ inputs.accept_token_lane || '0' }}
    steps:
      - uses: actions/checkout@08c0553e2053efb62c77670eb2152ec079f47c55 # v4.2.2
      - uses: actions/setup-node@2028fbcffad4a0b6df0e4900b0f046f0f46cf2ef # v4.1.0
        with:
          node-version: "20"
      - name: 安装依赖（锁文件快路）
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: live acceptance — 生产全真旅程
        run: node --test scripts/test-supply-owner-acceptance-live.mjs
