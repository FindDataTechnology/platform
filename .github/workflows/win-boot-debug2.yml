name: win-boot-debug2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - name: Download the published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.13 --repo ${{ github.repository }} --pattern "*.exe" --clobber

      - name: Silent install (NSIS /S)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem *.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs\platform" -Filter "Platform*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "not installed" }
          "APP_DIR=$(Split-Path $installed.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "APP_DIR=$env:APP_DIR"

      - name: Launch Platform.exe (GUI, Phase A shape) with stdout captured
        shell: pwsh
        run: |
          $out = "$env:TEMP\app-out.log"; $err = "$env:TEMP\app-err.log"
          $p = Start-Process -FilePath "$env:APP_DIR\Platform.exe" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "electron pid=$($p.Id)"
          $deadline = (Get-Date).AddMinutes(4)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if ($p.HasExited) { Write-Host "ELECTRON EXITED code=$($p.ExitCode)"; break }
            $nodes = Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:APP_DIR*" }
            if ($nodes) { Write-Host "node.exe alive: $($nodes.Id -join ',')" }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:47600/api/config" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "WINDOW TARGET -> 200 OK"; $ok = $true; break }
            } catch { Write-Host "waiting 47600: $($_.Exception.Message)" }
          }
          Write-Host "=== electron stdout ==="; Get-Content $out -Tail 120
          Write-Host "=== electron stderr ==="; Get-Content $err -Tail 60
          Write-Host "=== settings.json ==="; Get-Content "$env:APPDATA\platform\settings.json" -ErrorAction SilentlyContinue
          # keep evidence even on success
          if ($ok) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: ${{ runner.temp }}/app-*.log
          if-no-files-found: warn
