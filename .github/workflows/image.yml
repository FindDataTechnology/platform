# Container image publish — GitHub Actions → Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline (2026-10-01 org directive):
# GH(US) pushes to hkccr (Hong Kong, ~11.6MB/s), cheap-3's tcr-relay re-syncs
# hkccr → ccr (Guangzhou) every 5 min (skopeo, digest-stable), nodes pull from
# ccr.ccs.tencentyun.com with node-level registries.yaml auth (no
# imagePullSecret needed). Replaces this repo's 2026-09-30 image-tcr.yml,
# which pushed GH→ccr directly over the 0.14MB/s leg (30-90min uploads).
# Jenkins→Harbor remains the fallback channel.
#
# Divergence from the org template (fd-proxy-service), kept deliberately:
# the smoke gate — build (load, no push) → boot the image and probe
# /api/config → only then push. It caught a real phantom dependency
# (js-yaml, 2026-09-30) before the image ever reached the registry.
#
# Secrets: TCR_USERNAME / TCR_PASSWORD (org convention; NOT this repo's older
# TCR_USER/TCR_PASS, which are now unused).
#
# ccr-side availability lags hkccr by ≤5 min (relay). GitOps rolls should
# reference the ccr prefix and wait for the relay; hkccr references only from
# hosts with direct hk reachability.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

# QUEUED, not cancelling (openspec: queue-release-ci-runs). Killing an image
# build mid-push leaves a half-written tag; waiting is strictly better.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: yizuo
  IMAGE_NAME: platform
  DOCKERFILE: Dockerfile
  # The tag GitOps manifests reference (after the relay lands it on ccr).
  CCR_IMAGE: ccr.ccs.tencentyun.com/yizuo/platform

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Cold builds exceeded 90m before the gha cache had its first success;
    # 240m lets the first success break the cache deadlock.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: tag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - id: prev
        name: 读 main 当前 digest（内容基线）
        run: |
          img="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
          cur=$(docker buildx imagetools inspect "$img:main" \
                --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "digest=$cur" >> "$GITHUB_OUTPUT"
          echo "${{ env.IMAGE_NAME }} main 当前 digest: ${cur:-<不存在，本次为首次构建>}"

      # Build WITHOUT pushing: the smoke gate below decides whether this
      # image is allowed to exist in the registry.
      - name: Build image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: false
          load: true
          # 硬约束：开了 attestation，同内容两次构建 digest 必然不同，闸门永久失效。
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }},${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image before pushing (the Jenkins-era rule; see image-tcr
      # history for the two build-ok-boot-dead incidents it exists for).
      # Image size on record for every build (add-doc-studio 1.3: the office
      # execution layer's footprint is tracked per build, not measured once).
      - name: Record image size
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SIZE="$(docker images --format '{{.Size}}' "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG" | head -1)"
          echo "image size: $SIZE (${TAG})" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (/api/config)
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          docker rm -f platform-smoke >/dev/null 2>&1 || true
          docker run -d --name platform-smoke \
            -e AUTH_MODE=none -e PORT=3000 -e HOST=0.0.0.0 \
            -e PLATFORM_DATA_DIR=/data -e NODE_ENV=production \
            "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG" >/dev/null
          ok=0
          for i in $(seq 1 40); do
            sleep 5
            if docker exec platform-smoke curl -fsS -m 5 http://127.0.0.1:3000/api/config >/dev/null 2>&1; then
              ok=1; echo "smoke: /api/config healthy after ~$((i*5))s"; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' platform-smoke 2>/dev/null)" != "true" ]; then
              echo "smoke: container exited after ~$((i*5))s"; break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "SMOKE TEST FAILED — image does not serve /api/config; logs follow"
            docker logs platform-smoke 2>&1 | tail -40
            exit 1
          fi

      # Agent-liveness gate: /api/config is the SHALLOW route — a dead agent
      # runtime still returns 200 there. /api/ready flips 200 only after the
      # dsh child completed its initialize handshake, i.e. what every cell's
      # chat actually needs. 2026-10-09 prod roll sha-f2af032 passed the
      # /api/config probe and the /opt/dsh contracts while EVERY cell's dsh
      # child died on ERR_MODULE_NOT_FOUND (@deepseek-ai/cordis-plugin-loader
      # via the app-tree dsh binary dsh-bridge prefers) — this probe is that
      # missing gate; it would have caught the roll before it reached prod.
      - name: Smoke test (agent liveness — /api/ready)
        run: |
          set -e
          ok=0
          for i in $(seq 1 24); do
            code="$(docker exec platform-smoke curl -sS -m 5 -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:3000/api/ready 2>/dev/null || echo 000)"
            if [ "$code" = "200" ]; then
              ok=1; echo "smoke: /api/ready green after ~$((i*5))s: $(docker exec platform-smoke cat /tmp/ready.json)"; break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "SMOKE TEST FAILED — agent runtime did not become ready (/api/ready never 200); last body + logs follow"
            docker exec platform-smoke cat /tmp/ready.json 2>/dev/null | head -c 2000 || true
            echo
            docker logs platform-smoke 2>&1 | tail -50
            exit 1
          fi

      # The dsh-contracts gate (add-dsh-contracts, ADR-0007): the six
      # upstream-behavior contracts run IN the container against the image's
      # own /opt/dsh install — materializing a throwaway profile home, never
      # the baked /opt/dsh-home. Smoke passing now means boot probe + six
      # contracts, not just /api/config; a red contract keeps the image out of
      # the registry.
      - name: Smoke test (dsh contracts on /opt/dsh)
        run: docker exec platform-smoke node /app/scripts/dsh-contracts.mjs --tree /opt/dsh

      # Browser lane gate (add-browser-use-lane): the lane's MCP launcher must
      # complete an MCP handshake and answer tools/list inside the image —
      # catches a broken launcher/missing BROWSER_MCP_CLI before rollout.
      # (Chromium launch + real navigation rides the operation proof, CI sends
      # no outbound browser traffic here.)
      - name: Smoke test (browser lane — MCP handshake)
        run: docker exec platform-smoke node /app/scripts/browser-lane-smoke.mjs

      # Shared browser lane gate (slim-browser-lane-footprint 3.3): the pod-level
      # service must spawn the pinned CLI, accept a cell session over
      # streamable-http, ACTUALLY navigate, and route the screenshot into the
      # calling cell's workspace. Skips when the image declares no lane.
      - name: Smoke test (shared browser lane — real navigation)
        run: docker exec platform-smoke node /app/scripts/smoke-browser-lane-shared.mjs

      # Module-identity gate: the child resolves its plugins through the
      # PROFILE dir, not /opt/dsh directly — if anything shadows the runtime's
      # packages with the app tree's copies, the child loads two instances of
      # a package and its Symbols stop matching (2026-10-09 sha-e956091: every
      # tool call died on undefined.prepare; contracts on /opt/dsh cannot see
      # this). This probe resolves from the profile path and requires every
      # bridge package to land inside the matrix tree.
      - name: Smoke test (module identity — profile resolution)
        run: |
          docker exec platform-smoke node --input-type=module -e '
            import { createRequire } from "node:module";
            import { realpathSync } from "node:fs";
            const anchor = "/opt/dsh-home/profiles/platform/package.json";
            const req = createRequire(anchor);
            const pkgs = ["@deepseek-ai/schemastery", "@deepseek-ai/dsh-session", "@deepseek-ai/dsh-tools", "@deepseek-ai/dsh-sdk-jsonrpc-server"];
            const bad = [];
            for (const p of pkgs) {
              let real;
              try { real = realpathSync(req.resolve(p + "/package.json")); }
              catch { real = realpathSync(req.resolve(p)); }
              if (!real.startsWith("/opt/dsh/")) bad.push(`${p} -> ${real}`);
            }
            if (bad.length) {
              console.error("MODULE IDENTITY FAILED — profile resolution escapes the matrix tree:\n  " + bad.join("\n  "));
              process.exit(1);
            }
            console.log("module identity ok: all bridge packages resolve inside /opt/dsh");
          '

      # 只推滚动 main：不可变 tag 由下面的内容闸门决定是否铸造。
      - name: Push image
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:main"

      # 内容闸门：digest 变了才铸 sha-<commit>，让「同内容多 tag」结构上不可能。
      # 本文件没有 metadata-action，镜像由 docker push 落地；docker driver 下
      # build-push 的 output digest 是 config digest 而非 manifest digest，与
      # registry 基线不可比，所以 NEW 从 registry 的 :main 读回（与 OLD 同源）。
      - name: 内容变了才铸不可变 tag
        env:
          OLD: ${{ steps.prev.outputs.digest }}
        run: |
          set -euo pipefail
          img="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
          NEW=$(docker buildx imagetools inspect "$img:main" \
                --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          [ -n "$NEW" ] || { echo "::error::构建未产出 digest"; exit 1; }
          if [ "$NEW" = "$OLD" ]; then
            echo "内容未变（$NEW）：不铸新 tag"
            {
              echo "### 内容未变，未产出新 tag"
              echo ""
              echo "本次构建与 \`main\` 当前指向完全一致。"
              echo ""
              echo "- 可直接 pin：\`$img@$NEW\`"
              echo "- 滚动引用：\`$img:main\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$img:$tag" "$img@$NEW"
          echo "已铸 $tag → $NEW"
          {
            echo "### 内容有变化，已铸不可变 tag"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| tag | \`$tag\` |"
            echo "| digest | \`$NEW\` |"
            echo "| 上一内容 digest | \`${OLD:-<无>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          {
            echo "## image → hkccr"
            echo "Pushed \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:main\`"
            echo ""
            echo "\`$TAG\` 只在内容变化时铸造（见「内容变了才铸不可变 tag」一节）。"
            echo "Deploy: relay lands it on ccr within ≤5 min; then set \`${{ env.CCR_IMAGE }}:$TAG\` in fd-infra-deploy/all-services/prod/platform.yaml (see DEPLOY.md → Image pipeline)."
          } >> "$GITHUB_STEP_SUMMARY"
