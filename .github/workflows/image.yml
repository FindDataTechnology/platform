# Container image publish — GitHub Actions → Tencent TCR.
# Builds the platform image (single image; the facet service is a second
# entrypoint of the same image), gates it (boot smoke + dsh contracts),
# then pushes an immutable sha- tag plus the rolling main tag.
#
# Secrets: TCR_USERNAME / TCR_PASSWORD (registry write credentials).
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: yizuo
  IMAGE_NAME: platform
  DOCKERFILE: Dockerfile

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: tag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Build WITHOUT pushing: the gates below decide whether this image is
      # allowed to exist in the registry.
      - name: Build image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }},${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image before pushing — catches build-ok-boot-dead images.
      - name: Smoke test (/api/config)
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          docker rm -f platform-smoke >/dev/null 2>&1 || true
          docker run -d --name platform-smoke \
            -e AUTH_MODE=none -e PORT=3000 -e HOST=0.0.0.0 \
            -e PLATFORM_DATA_DIR=/data -e NODE_ENV=production \
            "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG" >/dev/null
          ok=0
          for i in $(seq 1 40); do
            sleep 5
            if docker exec platform-smoke curl -fsS -m 5 http://127.0.0.1:3000/api/config >/dev/null 2>&1; then
              ok=1; echo "smoke: /api/config healthy after ~$((i*5))s"; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' platform-smoke 2>/dev/null)" != "true" ]; then
              echo "smoke: container exited after ~$((i*5))s"; break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "SMOKE TEST FAILED — image does not serve /api/config; logs follow"
            docker logs platform-smoke 2>&1 | tail -40
            exit 1
          fi

      # The dsh contract gate: upstream-behavior contracts run IN the
      # container against the image's own /opt/dsh install.
      - name: Smoke test (dsh contracts on /opt/dsh)
        run: docker exec platform-smoke node /app/scripts/dsh-contracts.mjs --tree /opt/dsh

      - name: Push image
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          docker push "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG"
          docker push "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:main"

      - name: Summarize
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          {
            echo "## image published"
            echo "Pushed \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${TAG}\` (+ :main)"
          } >> "$GITHUB_STEP_SUMMARY"
