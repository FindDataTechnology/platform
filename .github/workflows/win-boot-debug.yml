name: win-boot-debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - name: Download the published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.13 --repo ${{ github.repository }} --pattern "*.exe" --clobber
          Get-ChildItem *.exe | Format-Table Name, Length

      - name: Silent install (NSIS /S)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem *.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3
          $installed = Get-ChildItem "$env:LOCALAPPDATA\Programs\platform" -Filter "Platform*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw "not installed" }
          "APP_DIR=$(Split-Path $installed.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Boot server.js DIRECTLY (Phase B shape) and capture everything
        shell: pwsh
        run: |
          $appRoot = "$env:APP_DIR\resources\app"
          $node = "$env:APP_DIR\resources\node\node.exe"
          Write-Host "node: $node"; & $node --version
          $env:PORT = "47900"
          $env:HOST = "127.0.0.1"
          $env:NODE_ENV = "production"
          # Boot under a temp HOME so nothing real is touched
          $env:USERPROFILE_OVERRIDE = "unused"
          $p = Start-Process -FilePath $node -ArgumentList "`"$appRoot\server.js`"" -PassThru `
                 -RedirectStandardOutput "$env:TEMP\boot-out.log" -RedirectStandardError "$env:TEMP\boot-err.log" `
                 -NoNewWindow
          $deadline = (Get-Date).AddMinutes(3)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if ($p.HasExited) { Write-Host "SERVER EXITED code=$($p.ExitCode) after $(((Get-Date)) )s"; break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:47900/api/config" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { Write-Host "DIRECT BOOT -> 200 OK"; $ok = $true; break }
            } catch { Write-Host "waiting: $($_.Exception.Message)" }
          }
          if ($ok) { Stop-Process -Id $p.Id -Force }
          Write-Host "=== stdout tail ==="; Get-Content "$env:TEMP\boot-out.log" -Tail 60
          Write-Host "=== stderr tail ==="; Get-Content "$env:TEMP\boot-err.log" -Tail 60

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs
          path: ${{ runner.temp }}/boot-*.log
          if-no-files-found: warn
