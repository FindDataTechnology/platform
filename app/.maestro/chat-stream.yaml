# Chat flow against a dead-LLM instance: a prompt must surface the server's
# error and leave the composer usable (no dead UI).
appId: com.finddata.platform
---
- launchApp
- tapOn:
    id: 'composer-input'
- inputText: '你好'
# The open keyboard pushes/hides the send button (38161606047: send-button
# not found mid-keyboard) — same trap the pairing flow already fixed.
- hideKeyboard
- tapOn:
    id: 'send-button'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 30000
